version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: matchme-postgres
    environment:
      POSTGRES_DB: matchme_db
      POSTGRES_USER: matchme_user
      POSTGRES_PASSWORD: matchme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchme_user -d matchme_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - matchme-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: matchme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - matchme-network

  # Match Me Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchme-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://matchme_user:matchme_password@postgres:5432/matchme_db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - matchme-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: matchme-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - matchme-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  matchme-network:
    driver: bridge